<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>PHYSICS LAB 3D — 3D物理演算サンドボックス</title>
<style>
:root{--bg:#060a12;--panel:rgba(10,17,30,.84);--line:rgba(56,189,248,.26);--cy:#00e5ff;--bl:#38bdf8;--am:#f59e0b;--rd:#ef4444;--tx:#e2e8f0;--dim:#94a3b8;--s2:rgba(20,32,54,.78);--top:68px;color-scheme:dark}
*{box-sizing:border-box;user-select:none;-webkit-user-select:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font:12px "Hiragino Kaku Gothic ProN","Yu Gothic UI",Meiryo,sans-serif}
#viewport{display:block;width:100vw;height:100vh;touch-action:none}
.gp{background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);box-shadow:0 8px 32px rgba(0,0,0,.55);border-radius:10px}
::-webkit-scrollbar{width:5px;height:5px}::-webkit-scrollbar-thumb{background:rgba(56,189,248,.32);border-radius:3px}
#top{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:10px;right:10px;min-height:48px;display:flex;align-items:center;justify-content:space-between;padding:5px 12px;z-index:20;gap:8px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px;flex-shrink:0}
.logo{width:28px;height:28px;border-radius:7px;background:rgba(0,229,255,.18);border:1px solid var(--cy);display:grid;place-items:center;font-weight:800;color:var(--cy);font-size:13px;box-shadow:0 0 12px rgba(0,229,255,.35)}
.bt{font-weight:800;font-size:14px;letter-spacing:.08em;color:#fff}.bs{font-size:9px;color:var(--dim);letter-spacing:.14em}
.tc{display:flex;align-items:center;gap:5px;overflow-x:auto;max-width:100%;padding:2px 0}
.dv{width:1px;height:22px;background:rgba(148,163,184,.22);margin:0 2px;flex-shrink:0}
.btn,select.sel{display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:6px 9px;border-radius:7px;border:1px solid rgba(148,163,184,.22);background:var(--s2);color:var(--tx);font:600 11px inherit;font-family:inherit;cursor:pointer;transition:.18s;white-space:nowrap}
select.sel{outline:0;padding:5px 8px}
.btn:hover,select.sel:hover{border-color:var(--cy);background:rgba(0,229,255,.14);color:#fff}
.btn.active{border-color:var(--cy);background:rgba(0,229,255,.22);color:var(--cy)}
.btn:disabled{opacity:.4;cursor:not-allowed;pointer-events:none}
.pri{border-color:rgba(0,229,255,.55);background:rgba(0,229,255,.18);color:var(--cy)}
.dng{border-color:rgba(239,68,68,.45);background:rgba(239,68,68,.14);color:#fca5a5}
.warn{border-color:rgba(245,158,11,.45);background:rgba(245,158,11,.14);color:#fcd34d}
.tele{display:flex;gap:6px;font:11px Consolas,monospace;flex-shrink:0;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:5px;padding:4px 7px;border-radius:6px;background:rgba(6,10,18,.65);border:1px solid rgba(56,189,248,.18)}
.chip i{color:var(--dim);font-style:normal;font-size:10px}.chip b{color:var(--cy)}
#dot{width:7px;height:7px;border-radius:50%;background:#10b981;box-shadow:0 0 8px #10b981}#dot.p{background:var(--am);box-shadow:0 0 8px var(--am)}
.side{position:fixed;top:calc(var(--top) + env(safe-area-inset-top,0px));bottom:calc(48px + env(safe-area-inset-bottom,0px));width:274px;z-index:15;display:flex;flex-direction:column;overflow:hidden;transition:transform .28s cubic-bezier(.22,1,.36,1)}
#left{left:10px}#left.collapsed{transform:translateX(-288px)}#right{right:10px}#right.collapsed{transform:translateX(288px)}
.ph{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-bottom:1px solid rgba(56,189,248,.16);font-weight:700;font-size:11px;letter-spacing:.08em;color:var(--bl);flex-shrink:0}
.pb{padding:10px 12px;overflow-y:auto;display:flex;flex-direction:column;gap:12px;flex:1}
.st{font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--dim);margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
.tgl{position:fixed;top:calc(var(--top) + 8px + env(safe-area-inset-top,0px));z-index:16;width:26px;height:44px;display:grid;place-items:center;cursor:pointer;color:var(--cy);font-size:13px;border:0;font-family:inherit;transition:left .28s,right .28s}
#tl{left:290px}#left.collapsed+#tl{left:10px}#tr{right:290px}#right.collapsed+#tr{right:10px}
.tg{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.tb{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 4px;border-radius:8px;border:1px solid rgba(148,163,184,.18);background:var(--s2);color:var(--tx);cursor:pointer;font:600 10px inherit;font-family:inherit;transition:.16s}
.tb .ic{font-size:15px;line-height:1}.tb:hover{border-color:var(--bl);transform:translateY(-1px)}.tb.on{border-color:var(--cy);background:rgba(0,229,255,.2);color:var(--cy);box-shadow:0 0 10px rgba(0,229,255,.2)}
.og{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.oc{display:flex;align-items:center;gap:7px;padding:7px 8px;border-radius:8px;border:1px solid rgba(148,163,184,.18);background:var(--s2);cursor:pointer;text-align:left;color:var(--tx);font-family:inherit;transition:.15s}
.oc:hover{border-color:var(--bl)}.oc.on{border-color:var(--cy);background:rgba(0,229,255,.18)}
.sw0{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;font-size:13px;flex-shrink:0;border:1px solid}
.on1{font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.on2{font-size:9px;color:var(--dim)}.om{min-width:0}
.cg{background:rgba(6,11,20,.52);border:1px solid rgba(148,163,184,.15);border-radius:8px;padding:9px 10px;display:flex;flex-direction:column;gap:8px}
.sr{display:flex;flex-direction:column;gap:3px}.sh{display:flex;justify-content:space-between;font-size:11px}.sv{font:600 11px Consolas,monospace;color:var(--cy)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:5px;background:rgba(148,163,184,.22);border-radius:3px;outline:0;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--cy);border:2px solid #06101d;box-shadow:0 0 8px rgba(0,229,255,.7)}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--cy);border:2px solid #06101d}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:6px}.r3{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.r4{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}.r5{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.r4 .btn,.r5 .btn{padding:4px 2px;font-size:10px}
.ni{display:flex;flex-direction:column;gap:2px}.ni label{font:9px monospace;color:var(--dim)}
.num{width:100%;background:rgba(15,23,42,.9);border:1px solid rgba(148,163,184,.25);border-radius:5px;color:var(--tx);padding:4px 6px;font:11px Consolas,monospace;outline:0;user-select:text;-webkit-user-select:text}.num:focus{border-color:var(--cy)}
.cr{display:flex;align-items:center;gap:6px}input[type=color]{width:34px;height:26px;border:1px solid rgba(255,255,255,.25);border-radius:6px;background:transparent;cursor:pointer;padding:0}
.swl{display:flex;gap:5px;flex-wrap:wrap;flex:1}.dot{width:18px;height:18px;border-radius:50%;border:1.5px solid rgba(255,255,255,.25);cursor:pointer}.dot:hover{border-color:#fff}
.badge{padding:2px 7px;border-radius:99px;font-size:10px;background:rgba(0,229,255,.15);color:var(--cy);border:1px solid rgba(0,229,255,.35)}.badge.static{background:rgba(245,158,11,.16);color:#fcd34d;border-color:rgba(245,158,11,.4)}
.tr{display:flex;align-items:center;justify-content:space-between;font-size:11px}
.sw{position:relative;width:36px;height:20px;background:rgba(148,163,184,.25);border-radius:99px;cursor:pointer;border:1px solid rgba(255,255,255,.12);transition:.2s;flex-shrink:0}.sw.on{background:rgba(0,229,255,.45);border-color:var(--cy)}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform .2s}.sw.on::after{transform:translateX(16px)}
#bottom{position:fixed;bottom:calc(8px + env(safe-area-inset-bottom,0px));left:10px;right:10px;height:32px;padding:0 14px;display:flex;align-items:center;justify-content:space-between;z-index:15;gap:12px}
#hint{display:flex;align-items:center;gap:8px;min-width:0;white-space:nowrap;overflow:hidden}
#pill{padding:2px 8px;border-radius:5px;background:rgba(0,229,255,.18);border:1px solid rgba(0,229,255,.4);color:var(--cy);font-weight:700;font-size:10px;flex-shrink:0}
#desc{overflow:hidden;text-overflow:ellipsis}.keys{display:flex;gap:10px;color:var(--dim);font-size:10px;flex-shrink:0}
kbd{background:rgba(15,23,42,.9);border:1px solid rgba(148,163,184,.35);border-radius:4px;padding:1px 5px;font:10px Consolas,monospace;color:#e2e8f0}
#toasts{position:fixed;top:calc(68px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:50;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.toast{padding:8px 16px;border-radius:8px;background:rgba(8,15,28,.92);border:1px solid var(--cy);color:#fff;font-size:12px;font-weight:600;animation:ti .2s,to .25s 2.1s forwards}
@keyframes ti{from{opacity:0;transform:translateY(-10px)}}@keyframes to{to{opacity:0;transform:translateY(-8px)}}
@media(max-width:960px){.keys,.bs{display:none}.side{width:248px}#tl{left:262px}#tr{right:262px}#left.collapsed{transform:translateX(-262px)}#right.collapsed{transform:translateX(262px)}}
@media(max-width:760px){:root{--top:96px}#top{padding:4px 8px;gap:4px}.tc{order:3;width:100%;flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch}.tele{gap:4px}.chip{padding:3px 5px;font-size:10px}}
#cam-pad{position:fixed;bottom:calc(46px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);z-index:18;display:none;align-items:center;gap:4px;padding:4px 6px}
#cam-pad.show{display:flex}
@media(pointer:coarse),(max-width:960px){#cam-pad{display:flex}}
#cam-pad .btn{padding:6px 10px;font-size:11px;min-height:32px}
.model-dropzone{border:1px dashed rgba(56,189,248,.45);border-radius:8px;padding:10px 8px;text-align:center;color:var(--dim);background:rgba(0,229,255,.04);line-height:1.5;transition:.18s;cursor:pointer;outline:0}
.model-dropzone:hover,.model-dropzone:focus,.model-dropzone.dragover{border-color:var(--cy);background:rgba(0,229,255,.14);color:#fff}
.model-dropzone strong{display:block;color:var(--bl);font-size:11px}
.model-dropzone small{font-size:9px}
</style>

<body>
<canvas id="viewport"></canvas>
<header id="top" class="gp">
  <div class="brand"><div class="logo">P3D</div><div><div class="bt">PHYSICS LAB 3D</div><div class="bs">INTERACTIVE SANDBOX FACILITY</div></div></div>
  <div class="tc">
    <button id="b-pause" class="btn warn" title="一時停止 (Space)">⏸ 一時停止</button>
    <button id="b-resume" class="btn pri" title="再開 (Space)">▶ 再開</button>
    <button id="b-step" class="btn" title="1コマ進める (.)">⏭ 1コマ</button>
    <select id="scene-preset" class="sel" title="実験シーンプリセット">
      <option value="default">🧪 標準ラボ</option>
      <option value="domino">🁫 ドミノウェーブ</option>
      <option value="jenga">🪵 巨大ジェンガ</option>
      <option value="pendulum">💣 振り子破壊</option>
      <option value="castle">🏰 城壁と大砲</option>
      <option value="zerog">🌌 無重力カオス</option>
    </select>
    <button id="b-reset" class="btn" title="選択中プリセットに戻す (R)">↺ リセット</button>
    <button id="b-undo" class="btn" title="元に戻す (Ctrl+Z)" disabled>↶ Undo</button>
    <button id="b-redo" class="btn" title="やり直す (Ctrl+Y)" disabled>↷ Redo</button>
    <button id="b-clear" class="btn dng">🗑 全削除</button>
    <div class="dv"></div>
    <button id="b-save" class="btn">💾 保存</button>
    <button id="b-load" class="btn">📂 読込</button>
    <button id="b-export" class="btn">⬇ JSON出力</button>
    <button id="b-import" class="btn">⬆ JSON読込</button>
    <button id="b-model" class="btn pri" title="GLB / glTF / FBX / OBJ / VRM / STL モデルを読み込む">📥 モデル</button>
    <div class="dv"></div>
    <button id="b-sound" class="btn active">🔊 音ON</button>
  </div>
  <div class="tele">
    <div class="chip"><span id="dot"></span><b id="state">RUN</b></div>
    <div class="chip"><i>FPS</i><b id="h-fps">60</b></div>
    <div class="chip"><i>OBJ</i><b id="h-obj">0</b></div>
    <div class="chip"><i>破片</i><b id="h-deb">0</b></div>
    <div class="chip"><i>KE</i><b id="h-ke">0J</b></div>
    <div class="chip"><i>G</i><b id="h-g">-9.8</b></div>
  </div>
</header>
<aside id="left" class="side gp"></aside><button id="tl" class="tgl gp" title="左パネル開閉">◀</button>
<aside id="right" class="side gp"></aside><button id="tr" class="tgl gp" title="右パネル開閉">▶</button>
<div id="cam-pad" class="gp" aria-label="モバイル視点操作">
  <button id="cm-tool" class="btn active" title="選択中のツールを使用">🛠 ツール</button>
  <button id="cm-rot" class="btn" title="1本指で視点を回転">🔄 回転</button>
  <button id="cm-pan" class="btn" title="1本指で視点を移動">✥ 移動</button>
  <button id="cm-center" class="btn" title="視点を中央に戻す">⌖ 中央</button>
</div>
<footer id="bottom" class="gp">
  <div id="hint"><span id="pill">選択ツール</span><span id="desc"></span></div>
  <div style="display:flex;align-items:center;gap:8px;flex-shrink:0">
    <button id="b-campad" class="btn" style="padding:3px 8px;font-size:10px" title="視点操作パッドを表示/非表示">🎥 視点パッド</button>
    <div class="keys"><span><kbd>WASD</kbd> 移動</span><span><kbd>ドラッグ</kbd> 視点/平行移動</span><span><kbd>Space</kbd> 停止/再開</span><span><kbd>.</kbd> 1コマ</span><span><kbd>Del</kbd> 削除</span><span><kbd>Ctrl+D</kbd> 複製</span><span><kbd>R</kbd> リセット</span></div>
  </div>
</footer>
<div id="drop" style="display:none;position:fixed;inset:0;z-index:60;background:rgba(0,229,255,.12);border:2px dashed var(--cy);pointer-events:none;align-items:center;justify-content:center;font-size:18px;color:#fff">GLB / glTF / FBX / OBJ / VRM / STL をドロップして読み込み</div>
<div id="toasts"></div>
<input id="model-file" type="file" accept=".glb,.gltf,.fbx,.obj,.vrm,.stl" style="display:none">
<input id="file" type="file" accept=".json,application/json" style="display:none">

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

import * as CANNON from 'cannon-es';

import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';
import { STLLoader } from 'three/addons/loaders/STLLoader.js';
import * as SkeletonUtils from 'three/addons/utils/SkeletonUtils.js';

const $ = id => document.getElementById(id), rad = THREE.MathUtils.degToRad, deg = THREE.MathUtils.radToDeg;
const STORAGE_KEY = 'physics_lab_3d_saved_scene_v1', MAX_DEBRIS = 140;

/* ---------- presets ---------- */
const PRESETS = {};
[
 ['cube','立方体','標準ブロック','🧊','box',{w:1,h:1,d:1},2,.4,.3,'#38bdf8',.15,.38,1,11.5],
 ['sphere','球体','標準スフィア','⚪','sphere',{r:.55},1.6,.3,.5,'#a855f7',.2,.3,1,12.5],
 ['cylinder','円柱','シリンダー','🛢️','cylinder',{rt:.5,rb:.5,h:1.2},2.2,.45,.25,'#10b981',.2,.4,1,11.5],
 ['cone','円錐','コーン','🔺','cone',{rt:.02,rb:.58,h:1.25},1.8,.45,.2,'#f97316',.15,.45,1,10.5],
 ['box','直方体','ロングビーム','▬','box',{w:2,h:.65,d:.9},2.8,.5,.2,'#0ea5e9',.12,.45,1,10.5],
 ['domino','ドミノ','縦長ピース','🁫','box',{w:.75,h:1.6,d:.22},1.2,.55,.15,'#f8fafc',.1,.4,0,999],
 ['prism','三角柱','プリズム','📐','prism',{r:.65,h:1.1},2,.45,.25,'#ec4899',.18,.35,1,11],
 ['metal','金属ブロック','高重量・高耐久','🔩','box',{w:1.05,h:1.05,d:1.05},12,.25,.2,'#cbd5e1',.88,.22,1,26,'metal'],
 ['wood','木製ブロック','軽量・破壊易','🪵','box',{w:1.2,h:.8,d:.9},1.2,.65,.15,'#d49a6a',.04,.78,1,7.2,'wood'],
 ['glass','ガラス','超脆性・半透明','🪟','box',{w:1.1,h:1.1,d:.35},1.4,.12,.25,'#bae6fd',.1,.08,1,4.6,null,{transparent:true,opacity:.46}],
 ['ice','氷ブロック','超低摩擦 (0.02)','❄️','box',{w:1.1,h:.9,d:1.1},1.5,.02,.15,'#7dd3fc',.05,.12,1,6.8,null,{transparent:true,opacity:.78}],

 ['rubber','ゴムボール','高反発 (0.95)','🏀','sphere',{r:.52},1,.85,.95,'#f43f5e',.05,.55,0,999],
 ['ironball','重い鉄球','破壊用大質量','💣','sphere',{r:.72},32,.3,.15,'#475569',.92,.28,0,999,'metal']
].forEach(([id,name,tag,icon,shape,dims,mass,friction,restitution,color,metalness,roughness,d,breakThreshold,texture,extra]) =>
  PRESETS[id] = {id,name,tag,icon,shape,dims,mass,friction,restitution,color,metalness,roughness,destructible:!!d,breakThreshold,texture,...(extra||{})});

const TOOLS = [
 ['select','🖱️','選択','選択ツール','クリックで選択し、3Dギズモで位置を移動できます。'],
 ['grab','✋','掴む','グラブ＆投擲','オブジェクトを直接掴んで空中で振り回し、離して投げ飛ばします！'],
 ['place','📦','配置','配置ツール','クリックで配置、ドラッグで進行方向に連続配置します（ドミノ並べに最適）。'],
 ['launch','🚀','投射','投射ツール','クリックした3D方向へオブジェクトを高速で発射します。'],
 ['impulse','⚡','衝撃銃','ピンポイント衝撃銃','クリックした点にレーザー衝撃を与え、狙った1個だけを弾き飛ばします。'],
 ['explode','💥','爆発','爆発ツール','クリック地点で衝撃波を伴う爆発を起こし、周囲の物体を吹き飛ばします。'],
 ['wind','💨','風','風ツール','クリックした地点へ強力な突風を吹き付けます（押し続けると連続噴射）。'],
 ['magnet','🧲','引力','引力 / 斥力ツール','押し続けて周囲の物体を引き寄せます（左パネルで斥力モードに切替可）。'],
 ['pin','📌','固定','固定ツール','クリックしたオブジェクトを空間に固定・解除します。'],
 ['duplicate','🧬','複製','複製ツール','クリックしたオブジェクトの設定を引き継いで上空に複製します。'],
 ['rope','🪢','ロープ','ロープツール','接続する2つのオブジェクトを順にクリックして、たわむロープで接続します。'],
 ['delete','❌','削除','削除ツール','クリックしたオブジェクトやロープを削除します。']
];

/* ---------- sound ---------- */

    case 'box': return new THREE.BoxGeometry(d.w, d.h, d.d);
    case 'sphere': return new THREE.SphereGeometry(d.r, 28, 20);

function mkShape(p, s) {

    case 'box': return new CANNON.Box(new CANNON.Vec3(d.w * s / 2, d.h * s / 2, d.d * s / 2));
    case 'sphere': return new CANNON.Sphere(d.r * s);

function makeRopeGeometry() {

function localSurfaceAnchor(obj, worldDirection) {

    case 'sphere': distance = d.r * scale; break;

      distance = Math.min(hx / Math.max(1e-6, Math.abs(dir.x)), hy / Math.max(1e-6, Math.abs(dir.y)), hz / Math.max(1e-6, Math.abs(dir.z)));

    }

      const radial = Math.hypot(dir.x, dir.z), slope = (rt - rb) / h;

      const sideY = dir.y * sideT;
      if (sideT > 0 && Math.abs(sideY) <= h / 2 + 1e-5) distance = sideT;
      else {
        const capY = dir.y >= 0 ? h / 2 : -h / 2;
        const capR = dir.y >= 0 ? rt : rb;
        const capT = Math.abs(dir.y) > 1e-6 ? capY / dir.y : Infinity;
        distance = capT > 0 && radial * capT <= capR + 1e-5 ? capT : Math.min(h / 2, Math.max(rb, rt));
      }

    }

      distance = (obj.mesh.geometry.boundingSphere?.radius || .5) * scale;

  return dir.scale(distance * 1.015);
}

function setRopeTension(rope, tension) {

    for (const equation of constraint.equations || []) { equation.maxForce = value; equation.minForce = -value; }

function curvePointAtDistance(samples, cumulative, distance) {
  const total = cumulative[cumulative.length - 1];
  const target = THREE.MathUtils.clamp(distance, 0, total);
  let i = 1;

/* ---------- shatter / effects ---------- */
const debrisGeo = new THREE.BoxGeometry(1, 1, 1);
function shatter(obj, intensity = 14) {
  if (!obj || !obj.alive) return;
  const c = obj.body.position.clone(), bv = obj.body.velocity.clone(), s = obj.scale, color = obj.color, n = s > 1.4 ? 8 : 6, p = obj.preset, mass = obj.mass;
  const isBomb = !!p.isBomb;
  removeObject(obj); sfx.shatter();
  burst(new THREE.Vector3(c.x, c.y, c.z), color, 18, 7);
  while (debris.length + n > MAX_DEBRIS && debris.length) removeDebris(debris[0]);
  const pm = getPhysMat(.45, .25), R = () => Math.random() - .5;
  for (let i = 0; i < n; i++) {
    const sx = (.2 + Math.random() * .22) * s, sy = (.18 + Math.random() * .22) * s, sz = (.2 + Math.random() * .22) * s;
    const matP = { color: new THREE.Color(color), roughness: p.roughness, metalness: p.metalness };
    if (p.transparent) { matP.transparent = true; matP.opacity = p.opacity; matP.depthWrite = false; }
    const mesh = new THREE.Mesh(debrisGeo, new THREE.MeshStandardMaterial(matP));
    mesh.scale.set(sx, sy, sz); mesh.castShadow = !p.transparent; mesh.receiveShadow = true;
    const ox = R() * .65 * s, oy = R() * .65 * s, oz = R() * .65 * s;
    mesh.position.set(c.x + ox, c.y + oy, c.z + oz); scene.add(mesh);
    const body = new CANNON.Body({ mass: Math.max(.15, mass / n * .8), material: pm, position: new CANNON.Vec3(c.x + ox, c.y + oy, c.z + oz), linearDamping: .05, angularDamping: .08 });
    body.addShape(new CANNON.Box(new CANNON.Vec3(sx / 2, sy / 2, sz / 2)));
    const b = Math.min(12, intensity * .45);
    body.velocity.set(bv.x * .6 + R() * b, bv.y * .6 + Math.random() * b * .6 + 1.5, bv.z * .6 + R() * b);
    body.angularVelocity.set(R() * 14, R() * 14, R() * 14);

function removeDebris(d) {

    const th = Math.random() * Math.PI * 2, ph = Math.acos(2 * Math.random() - 1), sp = speed * (.35 + Math.random() * .85);
    vel.push(new THREE.Vector3(Math.sin(ph) * Math.cos(th) * sp, Math.abs(Math.cos(ph)) * sp + 1.5, Math.sin(ph) * Math.sin(th) * sp));
  }

  sw.position.copy(origin); scene.add(sw);
  const light = new THREE.PointLight(0xff8c00, 120, radius * 2.5, 1.5); light.position.set(origin.x, origin.y + .6, origin.z); scene.add(light);
  effects.push({ type: 's', mesh: sw, light, maxR: radius, age: 0, maxAge: .42 });

/* ---------- save / load ---------- */
function serialize() {
  const v = a => ({ x: a.x, y: a.y, z: a.z });
  return { version: 2, timestamp: new Date().toISOString(), world: { ...ws }, objects: objs.map(o => ({
    id: o.id, typeId: o.typeId, position: v(o.body.position), quaternion: { ...v(o.body.quaternion), w: o.body.quaternion.w },
    velocity: v(o.body.velocity), angularVelocity: v(o.body.angularVelocity),
    mass: o.mass, friction: o.friction, restitution: o.restitution, scale: o.scale, color: o.color, destructible: o.destructible, pinned: o.pinned })),
    ropes: ropes.map(r => ({ id: r.id, objectA: r.objA.id, objectB: r.objB.id, anchorA: { x: r.anchorA.x, y: r.anchorA.y, z: r.anchorA.z }, anchorB: { x: r.anchorB.x, y: r.anchorB.y, z: r.anchorB.z }, slack: r.slack, tension: r.tension, color: r.color })) };
}
function deserialize(data) {
  if (!data || !Array.isArray(data.objects)) throw new Error('無効なシーンデータ形式です');
  clearAll();
  if (data.world) { Object.assign(ws, data.world); applyGravity(); applyTheme(ws.theme); grid.visible = ws.showGrid; }
  let skipped = 0;
  data.objects.slice(0, 400).forEach(it => {
    if (String(it.typeId).startsWith('model:') && !PRESETS[it.typeId]) { skipped++; return; }
    spawnObject(it.typeId, it);
  });
  if (skipped) toast(`未読込のモデル ${skipped} 個をスキップしました（モデルを読み込み直してください）`);
  const byId = new Map(objs.map(o => [o.id, o]));
  (Array.isArray(data.ropes) ? data.ropes : []).slice(0, MAX_ROPES).forEach(it => {
    const a = byId.get(it.objectA), b = byId.get(it.objectB);
    if (a && b && a !== b) createRope(a, b, it);
  });
}

/* ---------- undo / redo ---------- */
const MAX_HISTORY = 100;
const undoStack = [], redoStack = [];
let historyReady = false, historyBusy = false;
function historySnapshot() { return { scene: serialize(), selectedId: selected?.alive ? selected.id : null }; }
function historySignature(s) { return JSON.stringify({ world: s.scene.world, objects: s.scene.objects, ropes: s.scene.ropes || [] }); }
function beginHistory() { return historyReady && !historyBusy ? historySnapshot() : null; }
function syncHistoryButtons() { $('b-undo').disabled = undoStack.length === 0; $('b-redo').disabled = redoStack.length === 0; }
function commitHistory(before, label = '操作') {
  if (!before || historyBusy) return;
  const after = historySnapshot();
  if (historySignature(before) === historySignature(after)) return;
  undoStack.push({ before, after, label });
  if (undoStack.length > MAX_HISTORY) undoStack.shift();
  redoStack.length = 0; syncHistoryButtons();
}
function restoreHistorySnapshot(snap) {
  historyBusy = true;
  try { deserialize(snap.scene); selectObject(objs.find(o => o.id === snap.selectedId) || null); }
  finally { historyBusy = false; syncHistoryButtons(); }
}
function undo() { const e = undoStack.pop(); if (!e) return; redoStack.push(e); restoreHistorySnapshot(e.before); toast(`元に戻しました: ${e.label}`); }
function redo() { const e = redoStack.pop(); if (!e) return; undoStack.push(e); restoreHistorySnapshot(e.after); toast(`やり直しました: ${e.label}`); }
$('b-undo').onclick = undo; $('b-redo').onclick = redo;

const sliderHistory = new WeakMap();
const SLIDER_KEYS = ['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Home', 'End', 'PageUp', 'PageDown'];
function wireSliderHistory() {
  document.querySelectorAll('input[type="range"]').forEach(el => {
    const start = () => { if (!sliderHistory.has(el)) sliderHistory.set(el, beginHistory()); };
    const finish = () => { if (!sliderHistory.has(el)) return; commitHistory(sliderHistory.get(el), '設定変更'); sliderHistory.delete(el); };
    el.addEventListener('pointerdown', start);
    el.addEventListener('keydown', e => { if (SLIDER_KEYS.includes(e.key)) start(); });
    ['pointerup', 'pointercancel', 'change', 'blur'].forEach(t => el.addEventListener(t, finish));
  });
}

function moveGrab(cx, cy) {
  if (!grabState) return;
  if (!grabState.obj.alive) { endGrab(); return; }
  updateRay(cx, cy);
  const pt = raycaster.ray.intersectPlane(grabState.plane, new THREE.Vector3());
  if (!pt) return;
  pt.y = Math.max(.2, pt.y);
  grabState.anchorBody.position.set(pt.x, pt.y, pt.z);
  grabState.obj.body.wakeUp();
}
function endGrab() {
  if (!grabState) return;
  const g = grabState; grabState = null; controls.enabled = true;
  world.removeConstraint(g.constraint); world.removeBody(g.anchorBody);
  commitHistory(g.before, 'グラブ移動');
}

/* ---------- move gizmo (select tool) ---------- */
const moveGizmo = new THREE.Group(); moveGizmo.visible = false; scene.add(moveGizmo);
const GIZMO_COLORS = { x: 0xef4444, y: 0x10b981, z: 0x38bdf8 };
const GIZMO_DIRS = { x: new THREE.Vector3(1, 0, 0), y: new THREE.Vector3(0, 1, 0), z: new THREE.Vector3(0, 0, 1) };
function makeGizmoAxis(axis) {
  const g = new THREE.Group();
  g.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), GIZMO_DIRS[axis]);
  const vis = new THREE.MeshBasicMaterial({ color: GIZMO_COLORS[axis], depthTest: false });
  const pickMat = new THREE.MeshBasicMaterial({ transparent: true, opacity: 0, depthWrite: false, depthTest: false });
  const shaft = new THREE.Mesh(new THREE.CylinderGeometry(.025, .025, .72, 10), vis); shaft.position.y = .38; shaft.renderOrder = 20; g.add(shaft);
  const tip = new THREE.Mesh(new THREE.ConeGeometry(.075, .2, 12), vis); tip.position.y = .86; tip.renderOrder = 20; g.add(tip);
  const picker = new THREE.Mesh(new THREE.CylinderGeometry(.13, .13, 1.05, 10), pickMat); picker.position.y = .5; picker.userData.axis = axis; picker.renderOrder = 21; g.add(picker);
  moveGizmo.add(g);
}
['x', 'y', 'z'].forEach(makeGizmoAxis);

let gizmoDrag = null, placementDrag = false, placeDrag = null;
function placeStepDist() { return curType === 'domino' ? .85 * spawnCfg.scale : Math.max(.9, halfH(PRESETS[curType], spawnCfg.scale) * 2.1); }
function spawnAtPoint(pt, yawDeg) {
  const p = PRESETS[curType], y = pt.y + halfH(p, spawnCfg.scale) + .02;
  return spawnObject(curType, { mass: spawnCfg.mass, friction: spawnCfg.friction, restitution: spawnCfg.restitution,
    scale: spawnCfg.scale, color: spawnCfg.color, destructible: spawnCfg.destructible,
    rotX: spawnCfg.rotX, rotY: yawDeg ?? spawnCfg.rotY, rotZ: spawnCfg.rotZ,
    position: { x: pt.x, y, z: pt.z }, velocity: { x: spawnCfg.velX, y: spawnCfg.velY, z: spawnCfg.velZ } });
}
function stepPlaceDrag(cx, cy) {
  if (!placeDrag) return;
  updateRay(cx, cy);
  const pt = raycaster.ray.intersectPlane(new THREE.Plane(new THREE.Vector3(0, 1, 0), -placeDrag.baseY), new THREE.Vector3());
  if (!pt) return;
  if (!placeDrag.lastPt) { placeDrag.lastPt = pt.clone(); return; }
  const step = placeStepDist(), delta = pt.clone().sub(placeDrag.lastPt); delta.y = 0;
  let dist = delta.length(); if (dist < step) return;
  const dir = delta.normalize(), yawDeg = curType === 'domino' ? deg(Math.atan2(dir.x, dir.z)) : spawnCfg.rotY;
  if (!placeDrag.placedStart) { selectObject(spawnAtPoint(placeDrag.lastPt, yawDeg)); placeDrag.placedStart = true; placeDrag.count++; }
  let guard = 0;
  while (dist >= step && guard++ < 12) {
    const nextPt = placeDrag.lastPt.clone().addScaledVector(dir, step); nextPt.y = placeDrag.baseY;
    selectObject(spawnAtPoint(nextPt, yawDeg)); placeDrag.lastPt = nextPt; placeDrag.count++; dist -= step;
  }
}
function updateMoveGizmo() {
  const visible = !!selected && selected.alive && tool === 'select';
  moveGizmo.visible = visible;
  if (!visible) return;
  moveGizmo.position.copy(selected.mesh.position);
  moveGizmo.scale.setScalar(THREE.MathUtils.clamp(camera.position.distanceTo(moveGizmo.position) * .075, .75, 4.5));
}
function setBodyPosition(body, p) { body.position.copy(p); body.previousPosition.copy(p); body.interpolatedPosition.copy(p); body.initPosition.copy(p); body.aabbNeedsUpdate = true; body.wakeUp(); }
function beginGizmoDrag(cx, cy) {
  if (!selected || !selected.alive || tool !== 'select') return false;
  updateRay(cx, cy);
  const hit = raycaster.intersectObjects(moveGizmo.children, true).find(h => h.object.userData.axis);
  if (!hit) return false;
  const axis = hit.object.userData.axis, axisDir = GIZMO_DIRS[axis].clone(), origin = new THREE.Vector3().copy(selected.body.position);
  const viewDir = camera.position.clone().sub(origin).normalize();
  const normal = viewDir.clone().addScaledVector(axisDir, -viewDir.dot(axisDir));
  if (normal.lengthSq() < 1e-6) normal.copy(camera.up).addScaledVector(axisDir, -camera.up.dot(axisDir));
  normal.normalize();
  const plane = new THREE.Plane().setFromNormalAndCoplanarPoint(normal, origin);
  const start = raycaster.ray.intersectPlane(plane, new THREE.Vector3());
  if (!start) return false;
  const body = selected.body;
  gizmoDrag = { obj: selected, axis, axisDir, plane, startAxisPosition: start.dot(axisDir), startPosition: new THREE.Vector3().copy(body.position),
    before: beginHistory(), originalType: body.type, originalMass: body.mass };
  body.type = CANNON.Body.KINEMATIC; body.mass = 0; body.velocity.setZero(); body.angularVelocity.setZero(); body.updateMassProperties(); body.wakeUp();
  controls.enabled = false;
  return true;
}
function moveGizmoDrag(cx, cy) {
  if (!gizmoDrag) return;
  if (!gizmoDrag.obj.alive) { gizmoDrag = null; controls.enabled = true; return; }
  updateRay(cx, cy);
  const pt = raycaster.ray.intersectPlane(gizmoDrag.plane, new THREE.Vector3());
  if (!pt) return;
  const delta = pt.dot(gizmoDrag.axisDir) - gizmoDrag.startAxisPosition;
  const next = gizmoDrag.startPosition.clone().addScaledVector(gizmoDrag.axisDir, delta);
  if (!Number.isFinite(next.x + next.y + next.z)) return;
  setBodyPosition(gizmoDrag.obj.body, next); gizmoDrag.obj.mesh.position.copy(next);
  selHelper.setFromObject(gizmoDrag.obj.mesh); updateMoveGizmo();
}
function endGizmoDrag() {
  if (!gizmoDrag) return;
  const drag = gizmoDrag; gizmoDrag = null; controls.enabled = true;
  if (!drag.obj.alive) return;
  const body = drag.obj.body; body.type = drag.originalType; body.mass = drag.originalMass; body.updateMassProperties();
  body.velocity.setZero(); body.angularVelocity.setZero(); body.wakeUp();
  commitHistory(drag.before, 'ギズモ移動'); updateMoveGizmo();
}
function updatePreview() {
  if (!overCanvas || !['place', 'explode', 'wind', 'magnet', 'impulse'].includes(tool)) { preview.visible = ring.visible = false; return; }
  updateRay(lastMouse.x, lastMouse.y);
  const hit = rayHit();
  if (!hit) { preview.visible = ring.visible = false; return; }
  if (tool === 'place') {
    preview.position.copy(hit.point).addScaledVector(hitNormal(hit), halfH(PRESETS[curType], spawnCfg.scale) + .02);
    preview.rotation.set(rad(spawnCfg.rotX), rad(spawnCfg.rotY), rad(spawnCfg.rotZ)); preview.visible = true;
    ring.scale.setScalar(Math.max(.7, spawnCfg.scale)); ringMat.color.setHex(0x00e5ff);
  } else {
    preview.visible = false;
    ring.scale.setScalar(tool === 'explode' ? ws.explodeRadius * .55 : tool === 'magnet' ? 2.4 : tool === 'impulse' ? .65 : 1.6);
    ringMat.color.setHex(tool === 'explode' ? 0xf97316 : tool === 'magnet' ? (ws.magnetRepel ? 0xf43f5e : 0xa855f7) : tool === 'impulse' ? 0xfacc15 : 0x38bdf8);
  }
  ring.position.set(hit.point.x, hit.point.y + .04, hit.point.z); ring.visible = true;
}
function runTool(cx, cy) {
  const historyBefore = beginHistory();
  sfx.init(); updateRay(cx, cy);
  const hit = rayHit(), ho = hit ? meshMap.get(hit.object) : null;
  const common = () => ({ mass: spawnCfg.mass, friction: spawnCfg.friction, restitution: spawnCfg.restitution, scale: spawnCfg.scale, color: spawnCfg.color,
    rotX: spawnCfg.rotX, rotY: spawnCfg.rotY, rotZ: spawnCfg.rotZ, destructible: spawnCfg.destructible });
  switch (tool) {
    case 'select': {
      const rp = pickRope();
      if (rp && (!hit || rp.along <= hit.distance + .05)) selectRope(rp.rope); else selectObject(ho);
      break;
    }
    case 'place': {
      if (!hit) return;
      const pt = hit.point.clone().addScaledVector(hitNormal(hit), halfH(PRESETS[curType], spawnCfg.scale) + .02);
      selectObject(spawnObject(curType, { ...common(), position: { x: pt.x, y: pt.y, z: pt.z }, velocity: { x: spawnCfg.velX, y: spawnCfg.velY, z: spawnCfg.velZ } }));
      break;
    }
    case 'launch': {
      const dir = raycaster.ray.direction.clone().normalize(), sp = camera.position.clone().addScaledVector(dir, 2.2), v = ws.launchSpeed, R = () => (Math.random() - .5) * 6;
      const pr = spawnObject(curType, { ...common(), position: { x: sp.x, y: sp.y, z: sp.z }, velocity: { x: dir.x * v, y: dir.y * v + 1.5, z: dir.z * v }, angularVelocity: { x: R(), y: R(), z: R() } });
      sfx.launch(); selectObject(pr); break;
    }
    case 'impulse': {
      if (!hit) break;

      beamFx(start, hit.point, 0xfacc15); burst(hit.point, '#facc15', 16, 12); sfx.zap();
      if (ho && !ho.pinned) {
        ho.body.wakeUp();
        const dir = raycaster.ray.direction.clone().normalize();
        const imp = new CANNON.Vec3(dir.x * ws.impulsePower, dir.y * ws.impulsePower, dir.z * ws.impulsePower);
        const rel = new CANNON.Vec3(hit.point.x - ho.body.position.x, hit.point.y - ho.body.position.y, hit.point.z - ho.body.position.z);
        ho.body.applyImpulse(imp, rel);
        if (ho.destructible && ws.impulsePower / Math.max(.8, ho.mass * .3) > ho.preset.breakThreshold) shatter(ho, ws.impulsePower * .5);
      }
      break;
    }
    case 'explode': explode(hit ? hit.point : raycaster.ray.origin.clone().addScaledVector(raycaster.ray.direction, 15)); break;
    case 'wind': if (hit) windBlast(hit.point); break;
    case 'pin': if (ho) togglePin(ho); break;
    case 'duplicate': if (ho) duplicate(ho); break;
    case 'delete': {
      const rp = pickRope();
      if (rp && (!hit || rp.along <= hit.distance + .05)) { const id = rp.rope.id; removeRope(rp.rope); toast(`ロープ #${id} を削除しました`); }
      else if (ho) { const n = `${ho.preset.name} #${ho.id}`; removeObject(ho); toast(`${n} を削除しました`); }
      break;
    }
    case 'rope': {

      if (!ropeStartObject || !ropeStartObject.alive) { ropeStartObject = ho; selectObject(ho); toast(`${ho.preset.name} #${ho.id} を始点にしました。次のオブジェクトをクリックしてください`); break; }
      if (ropeStartObject === ho) { toast('別のオブジェクトを選択してください'); break; }
      if (ropes.length >= MAX_ROPES) { ropeStartObject = null; toast(`ロープは最大 ${MAX_ROPES} 本までです`); break; }
      const rope = createRope(ropeStartObject, ho);
      ropeStartObject = null;
      if (rope) { selectObject(ho); toast('たわむロープで接続しました'); } else toast('ロープを作成できませんでした');
      break;
    }

  if (['place', 'launch', 'impulse', 'explode', 'wind', 'delete', 'rope'].includes(tool)) {
    commitHistory(historyBefore, { place: '配置', launch: '投射', impulse: '衝撃銃', explode: '爆発', wind: '風', delete: '削除', rope: 'ロープ接続' }[tool]);
  }
}
canvas.addEventListener('pointerenter', () => overCanvas = true);
canvas.addEventListener('pointerleave', () => {
  if (placementDrag || gizmoDrag || grabState) return;
  overCanvas = holdingWind = holdingMagnet = false; preview.visible = ring.visible = false;
});
canvas.addEventListener('pointerdown', e => {
  activePointers.add(e.pointerId);
  if (activePointers.size >= 2) { cancelActiveToolDrags(); return; }
  if (!e.isPrimary || (e.pointerType === 'mouse' && e.button !== 0)) return;
  sfx.init(); downPos = { x: e.clientX, y: e.clientY }; lastMouse = { x: e.clientX, y: e.clientY }; overCanvas = true;
  if (camMode !== 'tool') return;
  if (beginGizmoDrag(e.clientX, e.clientY)) { e.preventDefault(); return; }
  if (tool === 'grab' && beginGrab(e.clientX, e.clientY)) { e.preventDefault(); return; }
  if (tool === 'place') {
    placementDrag = true; controls.enabled = false;
    updateRay(e.clientX, e.clientY);
    const hit = rayHit();
    placeDrag = { before: beginHistory(), lastPt: hit ? hit.point.clone() : null, baseY: hit ? hit.point.y : 0, placedStart: false, count: 0 };
    updatePreview(); e.preventDefault(); return;
  }
  if (tool === 'wind') holdingWind = true;
  if (tool === 'magnet') { holdingMagnet = true; controls.enabled = false; }
});
canvas.addEventListener('pointermove', e => {
  if (!e.isPrimary || activePointers.size >= 2) return;
  lastMouse = { x: e.clientX, y: e.clientY }; overCanvas = true;
  if (camMode !== 'tool') return;
  if (gizmoDrag) { moveGizmoDrag(e.clientX, e.clientY); return; }
  if (grabState) { moveGrab(e.clientX, e.clientY); return; }
  if (placementDrag) stepPlaceDrag(e.clientX, e.clientY);
  updatePreview();
});
canvas.addEventListener('pointerup', e => {
  activePointers.delete(e.pointerId);
  if (!e.isPrimary) return;
  holdingWind = false;
  if (holdingMagnet) { holdingMagnet = false; controls.enabled = true; }
  if (camMode !== 'tool') return;
  if (gizmoDrag) { endGizmoDrag(); return; }
  if (grabState) { endGrab(); return; }
  if (placementDrag) {
    placementDrag = false; controls.enabled = true;
    const drag = placeDrag; placeDrag = null;
    if (drag && drag.placedStart) { commitHistory(drag.before, '連続配置'); toast(`${drag.count} 個を連続配置しました`); }
    else runTool(e.clientX, e.clientY);
    updatePreview();
    return;
  }
  const tapLimit = e.pointerType === 'touch' ? 14 : 6;
  if ((e.pointerType !== 'mouse' || e.button === 0) && Math.hypot(e.clientX - downPos.x, e.clientY - downPos.y) < tapLimit) runTool(e.clientX, e.clientY);
});
canvas.addEventListener('pointercancel', e => {
  activePointers.delete(e.pointerId);
  cancelActiveToolDrags();
});

/* ---------- keyboard ---------- */
const keys = new Set();
addEventListener('keydown', e => {
  if (['INPUT', 'TEXTAREA', 'SELECT'].includes(e.target.tagName)) return;
  const k = e.key.toLowerCase(), mod = e.ctrlKey || e.metaKey;
  if (!mod) keys.add(k);
  if (mod && k === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if (mod && k === 'y') { e.preventDefault(); redo(); return; }
  if (e.code === 'Space') { e.preventDefault(); setPaused(!paused); }
  else if (e.key === '.') { e.preventDefault(); stepOnce(); }
  else if ((e.key === 'Delete' || e.key === 'Backspace') && selected) {
    e.preventDefault(); const before = beginHistory(); const n = `${selected.preset.name} #${selected.id}`; removeObject(selected); commitHistory(before, '削除'); toast(`${n} を削除しました`);
  }
  else if ((e.key === 'Delete' || e.key === 'Backspace') && selectedRope) { e.preventDefault(); deleteRope(selectedRope); }
  else if (mod && k === 'd') { e.preventDefault(); if (selected) duplicate(selected); }
  else if (!mod && k === 'r') { e.preventDefault(); const before = beginHistory(); starterScene(); commitHistory(before, 'リセット'); toast('シーンをリセットしました'); }
});
addEventListener('keyup', e => keys.delete(e.key.toLowerCase()));
addEventListener('blur', () => keys.clear());
function camMove(dt) {
  const f = (keys.has('w') || keys.has('arrowup') ? 1 : 0) - (keys.has('s') || keys.has('arrowdown') ? 1 : 0);
  const r = (keys.has('d') || keys.has('arrowright') ? 1 : 0) - (keys.has('a') || keys.has('arrowleft') ? 1 : 0);
  const u = (keys.has('e') ? 1 : 0) - (keys.has('q') ? 1 : 0);
  if (!f && !r && !u) return;
  const m = 16 * dt, fw = new THREE.Vector3(); camera.getWorldDirection(fw); fw.y = 0; fw.normalize();
  const rt = new THREE.Vector3().crossVectors(fw, new THREE.Vector3(0, 1, 0)).normalize();
  const d = fw.multiplyScalar(f * m).addScaledVector(rt, r * m); d.y = u * m;
  camera.position.add(d); controls.target.add(d);
}

/* ---------- main loop ---------- */
function stepPhysics(simDt) {
  if (ws.globalWind) {
    const a = rad(ws.windAngleDeg), fx = Math.cos(a) * ws.windPower, fz = Math.sin(a) * ws.windPower;
    for (const o of objs) if (!o.pinned) { const k = Math.max(.5, Math.sqrt(o.mass)) * .35; o.body.wakeUp(); o.body.applyForce(new CANNON.Vec3(fx * k, 0, fz * k)); }
  }
  if (holdingWind) {
    holdT += simDt;
    if (holdT > .15 && (windT += simDt) > .08) { windT = 0; updateRay(lastMouse.x, lastMouse.y); const h = rayHit(); if (h) windBlast(h.point); }
  } else holdT = 0;
  if (holdingMagnet) {
    updateRay(lastMouse.x, lastMouse.y); const h = rayHit(); if (h) magnetPulse(h.point, simDt);
  }
  world.step(1 / 60, simDt, 4);
  for (const rope of ropes) for (const node of rope.nodes) {
    const minY = ROPE_FLOOR_TOP + ROPE_RADIUS - .002;
    if (node.position.y < minY) { node.position.y = minY; if (node.velocity.y < 0) node.velocity.y = 0; node.wakeUp(); }
  }
  ropeWatchT += simDt;
  if (ropeWatchT > .5) { ropeWatchT = 0; checkRopes(); }
  if (pending.length) {
    const before = beginHistory();
    while (pending.length) { const s = pending.shift(); if (s.obj.alive) shatter(s.obj, s.impact); }
    commitHistory(before, '衝突による破壊');
  }
  for (const o of [...objs]) if (o.body.position.y < -40) removeObject(o);
  updateEffects(simDt);
}

const clock = new THREE.Clock(); let fpsT = 0, fpsN = 0, windT = 0, holdT = 0, ropeWatchT = 0;
function loop() {
  requestAnimationFrame(loop);
  const dt = Math.min(clock.getDelta(), .05);
  camMove(dt);
  if (!paused) stepPhysics(dt * ws.timeScale);
  for (const o of objs) {
    const p = o.body.position, q = o.body.quaternion;
    o.mesh.position.set(p.x, p.y, p.z); o.mesh.quaternion.set(q.x, q.y, q.z, q.w);
    updateTrail(o); updateVelArrow(o);
  }
  for (const rope of ropes) updateRopeMesh(rope);
  updateMoveGizmo();
  if (selected && selected.alive) {
    selHelper.setFromObject(selected.mesh);
    const p = selected.body.position, v = selected.body.velocity.length(), ke = .5 * selected.mass * v * v;
    $('sel-tele').textContent = `POS: ${p.x.toFixed(1)}, ${p.y.toFixed(1)}, ${p.z.toFixed(1)} | SPD: ${v.toFixed(1)} m/s | ${ke.toFixed(1)} J`;
    if (followSelected && prevFollowPos) {
      const delta = selected.mesh.position.clone().sub(prevFollowPos);
      camera.position.add(delta); controls.target.add(delta);
    }
    prevFollowPos = selected.mesh.position.clone();
  }
  if (selectedRope) {
    const r = selectedRope, chord = anchorWorldPosition(r.objA, r.anchorA).distanceTo(anchorWorldPosition(r.objB, r.anchorB));
    const asleep = r.nodes.filter(n => n.sleepState === CANNON.Body.SLEEPING).length;
    $('rope-tele').textContent = `両端 ${chord.toFixed(2)}m | 全長 ${(r.segmentLength * (ROPE_NODE_COUNT + 1)).toFixed(2)}m | 眠り ${asleep}/${r.nodes.length}`;
  }
  controls.update();
  renderer.render(scene, camera);
  fpsT += dt; fpsN++;
  if (fpsT >= .5) {
    let totalKE = 0;
    for (const o of objs) if (!o.pinned) totalKE += .5 * o.mass * o.body.velocity.lengthSquared();
    $('h-fps').textContent = Math.round(fpsN / fpsT); $('h-obj').textContent = objs.length; $('h-deb').textContent = debris.length;
    $('h-ke').textContent = totalKE >= 1000 ? (totalKE / 1000).toFixed(1) + 'kJ' : Math.round(totalKE) + 'J';
    fpsT = fpsN = 0;
  }
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight);
});

/* ---------- init ---------- */
const topBar = $('top');
const syncTopOffset = () => document.documentElement.style.setProperty('--top', (topBar.offsetHeight + 20) + 'px');
new ResizeObserver(syncTopOffset).observe(topBar); syncTopOffset();

setPaused(false);

if (innerWidth < 820) { $('left').classList.add('collapsed'); $('right').classList.add('collapsed'); $('tl').textContent = '▶'; $('tr').textContent = '◀'; }
loop();
